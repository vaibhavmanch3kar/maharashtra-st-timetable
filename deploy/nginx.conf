# =====================================================================
# MSRTC Timetable — nginx site configuration
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/msrtc
#   sudo ln -s /etc/nginx/sites-available/msrtc /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is not optional here. Service workers refuse to register over plain
# http on any host except localhost, so without a certificate the offline
# feature does not exist. Get one:
#   sudo certbot --nginx -d timetable.example.gov.in
# =====================================================================

# Brotli is a separate module and is absent from the Debian/Ubuntu nginx
# package. Load it only if present, so this config does not fail on a
# stock install.
#   load_module modules/ngx_http_brotli_static_module.so;

# ---------------------------------------------------------------------
# Rate limiting. A public timetable is a scrape target; this caps a single
# IP without inconveniencing a real user reloading a few times.
# ---------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=msrtc_rl:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=msrtc_conn:10m;

# ---------------------------------------------------------------------
# Port 80: redirect only. No content is served over plain http.
# ---------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name timetable.example.gov.in;

    # ACME challenge must stay reachable over http or renewal breaks.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
# Port 443: the application.
# ---------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name timetable.example.gov.in;

    root  /var/www/msrtc;
    index index.html;

    # ---- TLS --------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/timetable.example.gov.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timetable.example.gov.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;          # client cipher preference is better on TLS 1.3
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ---- Rate limits ------------------------------------------------
    limit_req  zone=msrtc_rl burst=60 nodelay;
    limit_conn msrtc_conn 20;

    # ---- Compression ------------------------------------------------
    # index.html is ~130 KB with the timetable embedded and gzips to about
    # 30 KB. On the 2G/3G links this app is actually used over, that
    # difference is several seconds of first paint.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json image/svg+xml
                      font/woff font/woff2;

    # If the brotli module is loaded, prefer pre-compressed .br files.
    # Generate them at deploy time:  brotli -kZ index.html sw.js
    # brotli_static on;

    # ---- Security headers -------------------------------------------
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(self), camera=(), microphone=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP. 'unsafe-inline' and 'unsafe-eval' are the direct cost of two
    # decisions in the brief: a single-file app puts all script and style
    # inline, and the Tailwind CDN compiles classes at runtime. Both can be
    # dropped by pre-building Tailwind and externalising the script — see
    # the deployment notes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    server_tokens off;

    # ---- Service worker: never cache --------------------------------
    # A cached service worker cannot be replaced. Get this wrong and every
    # returning user is pinned to an old timetable with no way out short of
    # a manual browser cache purge. This block is the most important six
    # lines in the file.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        expires -1;
        try_files $uri =404;
    }

    # ---- index.html: revalidate every load --------------------------
    # The timetable is embedded in the document, so a cached index.html is a
    # cached timetable. must-revalidate keeps it fresh at the cost of one
    # cheap 304.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    location = /manifest.json {
        add_header Cache-Control "public, max-age=86400" always;
        types { } default_type application/manifest+json;
    }

    # ---- Immutable static assets ------------------------------------
    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- Application routes -----------------------------------------
    # Fall back to index.html so deep links and the PWA start_url resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block dotfiles. A stray .git or .env in the web root is a full
    # source-code disclosure.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.html;

    access_log /var/log/nginx/msrtc.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/msrtc.error.log warn;
}
